  tests:
    build: .
    command:
      - python
      - -m
      - pytest
      - -m
      - ${PYTEST_MARKER:-api}
      - -q
      - --alluredir=allure-results
    environment:
      BASE_URL: http://api:8000
      API_TOKEN: ${API_TOKEN:-}
    depends_on:
      api:
        condition: service_healthy
